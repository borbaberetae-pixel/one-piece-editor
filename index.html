<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor visual RPG</title><style> *{box-sizing:border-box}body{background:#191524;color:#eee;font:14px system-ui;margin:0;padding:12px}h2,h3{color:#e7c17b}button,input,select,textarea{font:inherit;color:inherit;background:#30283e;border:1px solid #62536e;border-radius:6px;padding:8px}button{cursor:pointer}button:disabled{opacity:.5} .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;color:#c6b8d4;margin:5px 0}label input,label textarea{display:block;width:100%}#stage{position:relative;width:100%;overflow:hidden;touch-action:none}#bg{display:block;width:100%;height:auto}.overlay{position:absolute;display:flex;flex-direction:column;overflow:hidden;border:1px solid #a88b55;background:#191524bb;border-radius:3px}.overlay input,.overlay textarea{width:100%;height:100%;min-height:0;padding:2px;border:0;background:#fffD;color:#17131c;resize:none}.overlay.edit{border:2px dashed #e7c17b;cursor:move}.overlay.selected{outline:2px solid #75baff}.handle{position:absolute;bottom:0;right:0;width:16px;height:16px;background:#e7c17b;cursor:nwse-resize}.overlay span{font-size:10px;overflow:hidden;white-space:nowrap;pointer-events:none}#status{color:#e7c17b;overflow-wrap:anywhere} [hidden]{display:none!important}</style><h2>🏴‍☠️ One Piece RPG • Laboratório visual</h2><div class="row"><select id="sheet"><option value="a">Personagem 1</option><option value="b">Personagem 2</option></select><button id="toggle">Modelo visual</button></div><div id="status">Modo local de teste</div><section id="classic"><div id="fields"></div><div class="row"><button id="export">Exportar ficha</button><button id="import">Importar ficha JSON</button><input id="file" type="file" accept=".json" hidden></div></section><section id="visual" hidden><div class="row"><button id="image">Importar modelo visual</button><input id="imagefile" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="mode">Modo jogador</button></div><div id="editor"><div class="row"><input id="name" placeholder="Nome do campo"><select id="kind"><option value="text">Texto</option><option value="number">Número</option><option value="area">Texto longo / inventário</option></select><button id="add">+ Campo</button><button id="remove">Excluir campo selecionado</button></div><small>Arraste o campo pela caixa e redimensione pelo canto dourado.</small></div><div id="stage"><img id="bg" alt="Modelo da ficha" hidden><div id="overlays"></div></div><div class="row"><button id="modelExport">Exportar modelo JSON</button><button id="modelImport">Importar modelo JSON</button><input id="modelFile" type="file" accept=".json" hidden></div><small>Imagem e layout ficam neste navegador nesta versão experimental. Exporte o modelo para compartilhar.</small></section><script type="module" src="./app.js"></script></html>
